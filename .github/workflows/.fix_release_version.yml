name: 🔧 Temporary · 修复 Release 版本信息

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🛠️ 修复 Release 版本号、标题与摘要
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('.github/workflows/OPPO_OnePlus_Realme SM8750 Kernel Builder.yml')
          text = path.read_text(encoding='utf-8')

          # 1. Release Job 的版本号不能读取 build Job 的 GITHUB_ENV。
          #    改为通过 needs.build.outputs 读取 target/sub_version/target_device。
          step02 = '''    - name: 🏷️ 02 · 生成发布信息
          shell: bash
          run: |
            set -euo pipefail

            SUB_VERSION="${{ needs.build.outputs.sub_version }}"
            TARGET="${{ needs.build.outputs.target }}"
            TARGET_DEVICE="${{ needs.build.outputs.target_device }}"

            if [[ -z "$SUB_VERSION" ]]; then
              echo "❌ 无法获取内核子版本号：needs.build.outputs.sub_version 为空"
              exit 1
            fi

            if [[ -n "${{ inputs.kernel_suffix }}" ]]; then
              FULL_VERSION="${KERNEL_VERSION}.${SUB_VERSION}-${{ inputs.kernel_suffix }}"
            else
              FULL_VERSION="${KERNEL_VERSION}.${SUB_VERSION}"
            fi

            TIME="$(TZ='Asia/Shanghai' date +'%y%m%d%H%M%S')"
            TIME_FORM="$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')"
            TAG_HEAD="OPPO-OPlus-Realme-build"

            if [[ "${{ inputs.ksu_type }}" == "sukisu" ]]; then
              KSU_TYPENAME="SukiSU Ultra"
            elif [[ "${{ inputs.ksu_type }}" == "resukisu" ]]; then
              KSU_TYPENAME="ReSukiSU"
            elif [[ "${{ inputs.ksu_type }}" == "ksunext" ]]; then
              KSU_TYPENAME="KernelSU Next"
            elif [[ "${{ inputs.ksu_type }}" == "ksu" ]]; then
              KSU_TYPENAME="KSU"
            else
              KSU_TYPENAME="无内置KSU"
            fi

            {
              echo "FULL_VERSION=$FULL_VERSION"
              echo "TIME=$TIME"
              echo "TIME_FORM=$TIME_FORM"
              echo "TAG_HEAD=$TAG_HEAD"
              echo "KSU_TYPENAME=$KSU_TYPENAME"
              echo "TARGET=$TARGET"
              echo "TARGET_DEVICE=$TARGET_DEVICE"
            } >> "$GITHUB_ENV"

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🏷️ 发布版本信息"
            echo "📦 内核版本：$FULL_VERSION"
            echo "🎯 编译目标：$TARGET"
            echo "📱 目标设备：$TARGET_DEVICE"
            echo "🕐 编译时间：$TIME_FORM"
            echo "🔐 KSU：$KSU_TYPENAME"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
'''

          pattern02 = re.compile(
              r'    - name: 🏷️ 02 · 生成发布信息\n.*?(?=    - name: 🚀 03 · 创建 GitHub Release)',
              re.S,
          )
          if not pattern02.search(text):
              raise SystemExit('❌ 找不到 Release 的「02 · 生成发布信息」步骤，停止修改。')
          text = pattern02.sub(step02, text, count=1)

          # 2. Release Notes 中不再使用 Release Job 不存在的 env.SUB_VERSION / env.KERNEL_NAME。
          old_model = '- 机型：欧加真骁龙8Elite通用 ${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }} 内核（基于一加13国际版 ${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }} 版官方OKI源码）'
          new_model = '- 编译目标：${{ env.TARGET }}\\n- 目标设备：${{ env.TARGET_DEVICE }}\\n- 内核版本：${{ env.FULL_VERSION }}'
          if old_model not in text:
              raise SystemExit('❌ 找不到 Release Notes 中旧的机型/版本字段，停止修改。')
          text = text.replace(old_model, new_model, 1)

          # 3. 发布摘要增加真实版本、编译目标和目标设备，避免摘要只显示运行信息。
          pattern04 = re.compile(
              r'    - name: 📊 04 · 生成发布摘要\n.*?(?=    timeout-minutes: 30)',
              re.S,
          )
          step04 = '''    - name: 📊 04 · 生成发布摘要
      if: always()
      shell: bash
      run: |
        set -u

        echo ""
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "📊 04 · 发布摘要"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "▶ 工作流：${GITHUB_WORKFLOW}"
        echo "▶ 分支：${GITHUB_REF_NAME}"
        echo "▶ 运行编号：${GITHUB_RUN_NUMBER}"
        echo "▶ 内核版本：${FULL_VERSION:-${KERNEL_VERSION}.${SUB_VERSION}}"
        echo "▶ 编译目标：${TARGET:-${{ needs.build.outputs.target }}}"
        echo "▶ 目标设备：${TARGET_DEVICE:-${{ needs.build.outputs.target_device }}}"
        echo "▶ KSU：${KSU_TYPENAME:-未知}"
        echo "▶ 提交：${GITHUB_SHA}"

        {
          echo "## 🚀 发布任务摘要"
          echo ""
          echo "| 项目 | 信息 |"
          echo "| --- | --- |"
          echo "| 内核版本 | **${FULL_VERSION:-${KERNEL_VERSION}.${SUB_VERSION}}** |"
          echo "| 编译目标 | ${TARGET:-${{ needs.build.outputs.target }}} |"
          echo "| 目标设备 | ${TARGET_DEVICE:-${{ needs.build.outputs.target_device }}} |"
          echo "| KSU | ${KSU_TYPENAME:-未知} |"
          echo "| 工作流 | `${GITHUB_WORKFLOW}` |"
          echo "| 分支 | `${GITHUB_REF_NAME}` |"
          echo "| 运行编号 | `${GITHUB_RUN_NUMBER}` |"
          echo "| 提交 | `${GITHUB_SHA}` |"
        } >> "$GITHUB_STEP_SUMMARY"
'''
          if not pattern04.search(text):
              raise SystemExit('❌ 找不到 Release 的「04 · 生成发布摘要」步骤，停止修改。')
          text = pattern04.sub(step04, text, count=1)

          # 最终安全检查：Release Job 不应再引用不存在的 env.SUB_VERSION / env.KERNEL_NAME。
          release_pos = text.find('\n  release:\n')
          if release_pos < 0:
              raise SystemExit('❌ 找不到 release Job。')
          release_text = text[release_pos:]
          if '${{ env.SUB_VERSION }}' in release_text or '${{ env.KERNEL_NAME }}' in release_text:
              raise SystemExit('❌ Release Job 仍存在未修复的 env.SUB_VERSION/env.KERNEL_NAME 引用。')
          if 'needs.build.outputs.sub_version' not in release_text:
              raise SystemExit('❌ Release Job 未正确引用 needs.build.outputs.sub_version。')

          path.write_text(text, encoding='utf-8')
          print('✅ Release 版本号、标题与构建摘要已修复。')

      - name: 📤 提交修复并移除临时 Workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/.fix_release_version.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/OPPO_OnePlus_Realme\ SM8750\ Kernel\ Builder.yml .github/workflows/.fix_release_version.yml
          if git diff --cached --quiet; then
            echo "ℹ️ 没有需要提交的修改。"
            exit 0
          fi
          git commit -m "fix: 修复 Release 内核版本号与构建摘要 [skip ci]"
          git push origin HEAD:main
