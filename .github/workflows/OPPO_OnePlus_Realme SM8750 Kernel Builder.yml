name: 🚀 OPPO_OnePlus_Realme SM8750 Kernel Builder
run-name: '${{ github.workflow }} · ${{ inputs.kernel_target }} · ${{ inputs.ksu_type }} · #${{ github.run_number }}'

# ============================================================
# 🎛️ 手动编译参数
# ============================================================
"on":
  workflow_dispatch:
    inputs:
      kernel_target:
        description: 选择要编译的内核版本
        required: true
        type: choice
        default: 6.6.89
        options:
          - 6.6.30
          - 6.6.50
          - 6.6.56
          - 6.6.57
          - 6.6.66
          - 6.6.89
          - 6.6.89 MTK
          - 6.6.118
      ksu_type:
        description: KernelSU 分支
        required: true
        type: choice
        default: resukisu
        options:
          - resukisu
          - sukisu(SukiSU源码仓库已重定向为resukisu)
          - ksunext
          - ksu
          - none
      susfs_enable:
        description: 是否开启 SUSFS(用于增强隐藏环境挂载功能; 可能轻微增加耗电，上游更新导致不稳定时或不需要可关闭)
        required: true
        type: boolean
        default: true
      kpm_enable:
        description: 是否开启 KPM(使用KpatchNext独立实现kpm(支持任意KSU/面具环境); 不需要可保持默认关闭)
        required: true
        type: boolean
        default: false
      lz4_enable:
        description: 是否安装 LZ4 1.10.0 + ZSTD 1.5.7 补丁
        required: true
        type: boolean
        default: true
      lz4kd_enable:
        description: 是否安装 LZ4KD 补丁
        required: true
        type: boolean
        default: false
      bbr_enable:
        description: BBR 模式(优化上行数据,对手机日用无太大意义甚至可能负优化;false关闭,true仅加入算法,default启用算法并设为默认)
        required: true
        type: choice
        default: 'false'
        options:
          - 'false'
          - 'true'
          - default
      droidspaces_enable:
        description: DroidSpaces 容器支持(轻量化的完整Linux容器支持;false关闭,standard开启容器+ntsync支持,extend开启更多测试支持项)
        required: true
        type: choice
        default: 'false'
        options:
          - 'false'
          - standard
          - extend
      better_net:
        description: 是否开启高级网络功能拓展配置(用于为ipset及需要iptables等高级网络功能内核支持的程序提供支持)
        required: true
        type: boolean
        default: false
      adios_enable:
        description: 是否启用ADIOS IO调度器支持(提升IO读写性能)
        required: true
        type: boolean
        default: true
      rekernel_enable:
        description: 是否启用 Re-Kernel(与Freezer/NoActive等软件配合, 提升应用冻结能力)
        required: true
        type: boolean
        default: false
      baseband_guard:
        description: 是否开启内核级基带保护(阻止一切对非用户分区的写入，有效防止格机)
        required: true
        type: boolean
        default: true
      ccache_update:
        description: 是否更新仓库中的 ccache 缓存
        required: true
        type: boolean
        default: false
      ccache_debug:
        description: 是否上传 ccache 调试日志
        required: true
        type: boolean
        default: false
      kernel_suffix:
        description: 自定义内核版本后缀（可留空,开头别加连字符,勿加空格等影响指令运行的保留字符）
        required: false
        type: string
        default: ''

env:
  TZ: Asia/Shanghai
  ANDROID_VERSION: android15
  KERNEL_VERSION: '6.6'
  BUILDER_UI_VERSION: Professional Kernel Builder CN v3.0
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    outputs:
      ksuver: ${{ steps.ksu_version.outputs.ksuver }}
      ak3name: ${{ steps.create_zip.outputs.ak3name }}
      target: ${{ steps.target_config.outputs.target }}
      sub_version: ${{ steps.target_config.outputs.sub_version }}
      target_device: ${{ steps.target_config.outputs.target_device }}
    steps:
      - name: 🎯 00 · 选择并初始化编译目标
        id: target_config
        shell: bash
        run: |
          set -euo pipefail

          TARGET="${{ inputs.kernel_target }}"

          case "$TARGET" in
            "6.6.30")
              SUB_VERSION="30"
              KERNEL_SOURCE_URL="https://github.com/HeiKe-Tom/android_kernel_common_oneplus_sm8750/archive/refs/heads/oneplus/sm8750_v_15.0.0_oneplus_13.zip"
              KERNEL_EXTRACT_DIR="android_kernel_common_oneplus_sm8750-oneplus-sm8750_v_15.0.0_oneplus_13"
              TARGET_DEVICE="一加 13"
              CCACHE_KEY="ccache-ecsv4-6.6.30"
              RELEASE_PLATFORM="SM8750"
              RELEASE_DEVICE="一加 13"
              ;;
            "6.6.50")
              SUB_VERSION="50"
              KERNEL_SOURCE_URL="https://github.com/HeiKe-Tom/android_kernel_oneplus_mt6991/archive/refs/heads/oneplus/mt6991_v_15.0.2_ace5_ultra.zip"
              KERNEL_EXTRACT_DIR="android_kernel_oneplus_mt6991-oneplus-mt6991_v_15.0.2_ace5_ultra"
              TARGET_DEVICE="一加 Ace 5 Ultra / MT6991"
              CCACHE_KEY="ccache-ecsv4-6.6.50"
              RELEASE_PLATFORM="MT6991"
              RELEASE_DEVICE="一加 Ace 5 Ultra"
              ;;
            "6.6.56")
              SUB_VERSION="56"
              KERNEL_SOURCE_URL="https://github.com/HeiKe-Tom/android_kernel_common_oneplus_sm8750/archive/refs/heads/oneplus/sm8750_v_15.0.2_oneplus_13t.zip"
              KERNEL_EXTRACT_DIR="android_kernel_common_oneplus_sm8750-oneplus-sm8750_v_15.0.2_oneplus_13t"
              TARGET_DEVICE="一加 13T"
              CCACHE_KEY="ccache-ecsv4-6.6.56"
              RELEASE_PLATFORM="SM8750"
              RELEASE_DEVICE="一加 13T"
              ;;
            "6.6.57")
              SUB_VERSION="57"
              KERNEL_SOURCE_URL="https://github.com/HeiKe-Tom/android_kernel_common_oneplus_sm8750/archive/refs/heads/oneplus/sm8750_v_15.0.1_pad_2_pro.zip"
              KERNEL_EXTRACT_DIR="android_kernel_common_oneplus_sm8750-oneplus-sm8750_v_15.0.1_pad_2_pro"
              TARGET_DEVICE="一加 Pad 2 Pro"
              CCACHE_KEY="ccache-ecsv4-6.6.57"
              RELEASE_PLATFORM="SM8750"
              RELEASE_DEVICE="一加 Pad 2 Pro"
              ;;
            "6.6.66")
              SUB_VERSION="66"
              KERNEL_SOURCE_URL="https://github.com/HeiKe-Tom/android_kernel_common_oneplus_sm8750/archive/refs/heads/oneplus/sm8750_v_15.0.2_oneplus_13_6.6.66.zip"
              KERNEL_EXTRACT_DIR="android_kernel_common_oneplus_sm8750-oneplus-sm8750_v_15.0.2_oneplus_13_6.6.66"
              TARGET_DEVICE="一加 13"
              CCACHE_KEY="ccache-ecsv4-6.6.66"
              RELEASE_PLATFORM="SM8750"
              RELEASE_DEVICE="一加 13"
              ;;
            "6.6.89")
              SUB_VERSION="89"
              KERNEL_SOURCE_URL="https://github.com/HeiKe-Tom/android_kernel_common_oneplus_sm8750/archive/refs/heads/oneplus/sm8750_v_16.0.0_oneplus_13_6.6.89.zip"
              KERNEL_EXTRACT_DIR="android_kernel_common_oneplus_sm8750-oneplus-sm8750_v_16.0.0_oneplus_13_6.6.89"
              TARGET_DEVICE="一加 13"
              CCACHE_KEY="ccache-ecsv4-6.6.89"
              RELEASE_PLATFORM="SM8750"
              RELEASE_DEVICE="一加 13"
              ;;
            "6.6.89 MTK")
              SUB_VERSION="89_mtk"
              KERNEL_SOURCE_URL="https://github.com/HeiKe-Tom/android_kernel_oneplus_mt6991/archive/refs/heads/oneplus/mt6991_v_15.0.2_ace5_ultra_6.6.89.zip"
              KERNEL_EXTRACT_DIR="android_kernel_oneplus_mt6991-oneplus-mt6991_v_15.0.2_ace5_ultra_6.6.89"
              TARGET_DEVICE="一加 Ace 5 Ultra / MT6991"
              CCACHE_KEY="ccache-ecsv4-mtk_6.6.89"
              RELEASE_PLATFORM="MT6991"
              RELEASE_DEVICE="一加 Ace 5 Ultra"
              ;;
            "6.6.118")
              SUB_VERSION="118"
              KERNEL_SOURCE_URL="https://github.com/HeiKe-Tom/android_kernel_common_oneplus_sm8750/archive/refs/heads/oneplus/sm8750_b_16.0.0_oneplus_13_6.6.118.zip"
              KERNEL_EXTRACT_DIR="android_kernel_common_oneplus_sm8750-oneplus-sm8750_b_16.0.0_oneplus_13_6.6.118"
              TARGET_DEVICE="一加 13"
              CCACHE_KEY="ccache-ecsv4-6.6.118"
              RELEASE_PLATFORM="SM8750"
              RELEASE_DEVICE="一加 13"
              ;;
            *)
              echo "❌ 不支持的内核目标：$TARGET"
              exit 1
              ;;
          esac

          {
            echo "TARGET=$TARGET"
            echo "SUB_VERSION=$SUB_VERSION"
            echo "KERNEL_SOURCE_URL=$KERNEL_SOURCE_URL"
            echo "KERNEL_EXTRACT_DIR=$KERNEL_EXTRACT_DIR"
            echo "TARGET_DEVICE=$TARGET_DEVICE"
            echo "CCACHE_KEY=$CCACHE_KEY"
            echo "RELEASE_PLATFORM=$RELEASE_PLATFORM"
            echo "RELEASE_DEVICE=$RELEASE_DEVICE"
          } >> "$GITHUB_ENV"

          {
            echo "target=$TARGET"
            echo "sub_version=$SUB_VERSION"
            echo "target_device=$TARGET_DEVICE"
          } >> "$GITHUB_OUTPUT"

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🎯 编译目标：$TARGET"
          echo "📱 目标设备：$TARGET_DEVICE"
          echo "📦 内核版本：6.6.$SUB_VERSION"
          echo "🧩 平台：$RELEASE_PLATFORM"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: 📋 00 · 构建任务概览
        shell: bash
        run: 'set -e

          echo ""

          echo "╔══════════════════════════════════════════════════════════════╗"

          echo "║       🚀 OPPO_OnePlus_Realme SM8750 Kernel Builder           ║"

          echo "╠══════════════════════════════════════════════════════════════╣"

          echo "║ 平台        ：OPPO / OnePlus / Realme · SM8750              ║"

          echo "║ Android     ：${ANDROID_VERSION:-未指定}                    ║"

          echo "║ Kernel      ：${KERNEL_VERSION:-未指定}.${SUB_VERSION:-}   ║"

          echo "║ 架构        ：ARM64                                         ║"

          echo "║ 编译分支    ：${GITHUB_REF_NAME}                            ║"

          echo "╚══════════════════════════════════════════════════════════════╝"

          echo ""

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          echo "▶ 开始执行 "

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          '
      - name: 🔧 01 · 初始化编译环境
        run: "rm -rf kernel_workspace\nmkdir kernel_workspace\ncd kernel_workspace\necho \"当前仓库：$GITHUB_REPOSITORY\"\necho \"当前分支：$GITHUB_REF_NAME\"\n\nsudo apt-mark hold firefox &&\nsudo apt-mark hold libc-bin\
          \ &&\nsudo apt purge man-db &&\nsudo rm -rf /var/lib/man-db/auto-update &&\nsudo apt update &&\nsudo apt-get install -y --no-install-recommends binutils python-is-python3 libssl-dev libelf-dev &\n\
          #旧版完整指令：（由于经过验证大部分指令已内置于GitHub Action环境中，故进行精简）\n#sudo apt-get install -y --no-install-recommends curl bison flex make binutils git perl gcc python3 python-is-python3 bc libssl-dev libelf-dev zip\
          \ unzip ccache\n\n#使用最新版ccache-ECS（特化优化内核编译缓存，大幅提升二次不同配置编译速度）\nwget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/lib/ccache-x86-64 -O ccache &&\nsudo cp -f ./ccache /usr/bin/ccache\
          \ &&\nsudo chmod +x /usr/bin/ccache &&\nrm -f ./ccache &\n\necho \"正在克隆源码仓库...\"\naria2c -s16 -x16 -k1M $KERNEL_SOURCE_URL\
          \ -o common.zip && \nunzip -q common.zip && \nmv \"$KERNEL_EXTRACT_DIR\" common &&\nrm -rf common.zip &\n\necho \"正在克隆llvm-clang18工具链...\"\
          \ &&\nmkdir -p clang18 &&\naria2c -s16 -x16 -k1M https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang18-r510928/clang-r510928.zip -o clang.zip &&\nunzip -q clang.zip -d\
          \ clang18 &&\nrm -rf clang.zip &\n\necho \"正在克隆构建工具...\" &&\naria2c -s16 -x16 -k1M https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang18-r510928/build-tools.zip -o build-tools.zip\
          \ &&\nunzip -q build-tools.zip &&\nrm -rf build-tools.zip &\n\nwait\necho \"所有源码及llvm-Clang18工具链初始化完成！\"\necho \"正在去除 ABI 保护 & 去除 dirty 后缀...\"\nrm common/android/abi_gki_protected_exports_* ||\
          \ true\nfor f in common/scripts/setlocalversion; do\n  sed -i 's/ -dirty//g' \"$f\"\n  sed -i '$i res=$(echo \"$res\" | sed '\\''s/-dirty//g'\\'')' \"$f\"\ndone\n"
      - name: 💾 02 · 配置 ccache
        run: "echo \"CCACHE_DIR=$HOME/.ccache_${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }}\" >> $GITHUB_ENV\necho \"CCACHE_MAXSIZE=3G\" >> $GITHUB_ENV\necho \"当前磁盘空间：\"\ndf -h\necho \"当前构建内核版本：${{ env.KERNEL_VERSION\
          \ }}.${{ env.SUB_VERSION }}\"\nif [[ \"${{ inputs.droidspaces_enable }}\" != \"false\" ]]; then\n  CCACHE_REAL_KEY=${{ env.CCACHE_KEY }}-Droidspaces\nelse\n  CCACHE_REAL_KEY=${{ env.CCACHE_KEY\
          \ }}-none\nfi\necho \"CCACHE_REAL_KEY=$CCACHE_REAL_KEY\" >> $GITHUB_ENV\n"
      - name: 💾 03 · 恢复当前版本 ccache
        uses: actions/cache@v5
        id: ccache-restore
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ env.CCACHE_REAL_KEY }}-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: '${{ env.CCACHE_REAL_KEY }}-${{ runner.os }}-

            ${{ env.CCACHE_REAL_KEY }}-

            '
      - name: 💾 04 · 拉取公共预置 ccache
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: "echo \"检查本地缓存状态...\"\nif [ -d \"${{ env.CCACHE_DIR }}\" ] && [ \"$(ls -A ${{ env.CCACHE_DIR }} 2>/dev/null)\" ]; then\n  echo \"检测到本地已成功载入 ccache 缓存，跳过公共 ccache 拉取！\"\n  exit 0\nfi\n\necho \"\
          未命中缓存，尝试拉取最新公共 ccache ...\"\nmkdir -p ${{ env.CCACHE_DIR }}\nif [[ \"${{ inputs.droidspaces_enable }}\" != \"false\" ]]; then\n  FILE_NAME=\"ccache-${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION\
          \ }}-Droidspaces.tar.zst\"\nelse\n  FILE_NAME=\"ccache-${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }}.tar.zst\"\nfi\n\nif gh release download -p \"$FILE_NAME\" -R cctv18/public_ccache; then\n\
          \  echo \"成功下载 $FILE_NAME，正在解压...\"\n  tar -I zstd -xf \"$FILE_NAME\" -C ${{ env.CCACHE_DIR }}\n  echo \"公共 ccache 恢复完成！\"\nelse\n  echo \"公共 ccache 中未找到对应的 ccache 文件，将进行全量全新编译...\"\nfi\n"
      - name: 💾 05 · 清理旧 ccache
        if: inputs.ccache_update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: "echo \"正在清除仓库中的旧 ccache 缓存...\"\nif gh cache delete ${{ env.CCACHE_REAL_KEY }}-${{ runner.os }}-${{ github.ref_name }} -R ${{ github.repository }}; then\n  echo \"成功删除旧的 ccache 缓存！\"\nelse\n\
          \  echo \"旧缓存不存在或已被清理！\"\nfi\n"
      - name: 💾 06 · 初始化 ccache
        run: "# 设置ccache环境变量\nexport CCACHE_COMPILERCHECK=\"none\"\nexport CCACHE_BASEDIR=\"${{ github.workspace }}\"\nexport CCACHE_NOHASHDIR=\"true\"\nexport CCACHE_NOHARDLINK=\"true\"\nexport CCACHE_DIR=\"\
          ${{ env.CCACHE_DIR }}\"\nexport CCACHE_MAXSIZE=\"${{ env.CCACHE_MAXSIZE }}\"\n\n# 确保ccache目录存在\nmkdir -p \"$CCACHE_DIR\"\n\n# 每次运行都重新配置缓存大小\necho \"配置ccache缓存大小为: $CCACHE_MAXSIZE\"\nccache -M \"\
          $CCACHE_MAXSIZE\"\nccache -o compression=true\n\n# 显示初始缓存状态\necho \"ccache初始状态:\"\nccache -s\n\n# 如果缓存恢复命中，显示详细信息\nif [ \"${{ steps.ccache-restore.outputs.cache-hit }}\" == 'true' ]; then\n  echo\
          \ \"ccache缓存命中详情:\"\n  ccache -sv\nfi\n"
      - name: 🔐 07 · 集成 KernelSU
        id: ksu_version
        run: "# 进入内核工作目录\ncd kernel_workspace\nif [[ ${{ inputs.ksu_type }} == \"sukisu\" || ${{ inputs.ksu_type }} == \"resukisu\" ]]; then\n  echo \"正在配置ReSukiSU（由于SukiSU长期未维护无法正常编译，且ReSukiSU兼容sukisu管理器，故SukiSU源码仓库已重定向为resukisu）...\"\
          \n  curl -LSs \"https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/refs/heads/main/kernel/setup.sh\" | bash -s main\n  echo 'CONFIG_KSU_FULL_NAME_FORMAT=\"%TAG_NAME%-%COMMIT_SHA%@cctv18\"' >> ./common/arch/arm64/configs/gki_defconfig\n\
          \  cd ./KernelSU\n  # 生成自定义版本号（基于提交计数）, 失败时使用 114514\n  KSU_VERSION=$(expr $(git rev-list --count main) + 30700 2>/dev/null || echo 114514)\n  # 存储版本号到 GitHub 环境变量\n  echo \"KSUVER=$KSU_VERSION\"\
          \ >> $GITHUB_ENV\n  echo \"ksuver=$KSU_VERSION\" >> $GITHUB_OUTPUT\nelif [[ ${{ inputs.ksu_type }} == \"ksunext\" ]]; then\n  echo \"正在配置KernelSU Next...\"\n  curl -LSs \"https://raw.githubusercontent.com/pershoot/KernelSU-Next/refs/heads/dev-susfs/kernel/setup.sh\"\
          \ | bash -s dev-susfs\n  cd KernelSU-Next\n  rm -rf .git\n  KSU_VERSION=$(expr $(curl -sI \"https://api.github.com/repos/pershoot/KernelSU-Next/commits?sha=dev&per_page=1\" | grep -i \"link:\" |\
          \ sed -n 's/.*page=\\([0-9]*\\)>; rel=\"last\".*/\\1/p') \"+\" 30000)\n  echo \"KSUVER=$KSU_VERSION\" >> $GITHUB_ENV\n  echo \"ksuver=$KSU_VERSION\" >> $GITHUB_OUTPUT\n  sed -i \"s/KSU_VERSION_FALLBACK\
          \ := 1/KSU_VERSION_FALLBACK := $KSU_VERSION/g\" kernel/Kbuild\n  KSU_GIT_TAG=$(curl -sL \"https://api.github.com/repos/KernelSU-Next/KernelSU-Next/tags\" | grep -o '\"name\": *\"[^\"]*\"' | head\
          \ -n 1 | sed 's/\"name\": \"//;s/\"//')\n  sed -i \"s/KSU_VERSION_TAG_FALLBACK := v0.0.1/KSU_VERSION_TAG_FALLBACK := $KSU_GIT_TAG/g\" kernel/Kbuild\n  #为KernelSU Next添加WildKSU管理器支持\n  cd ../common/drivers/kernelsu\n\
          \  wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/other_patch/apk_sign.patch\n  patch -p2 -N -F 3 < apk_sign.patch || true\nelif [[ ${{ inputs.ksu_type }}\
          \ == \"ksu\" ]]; then\n  echo \"正在配置原版 KernelSU (tiann/KernelSU)...\"\n  curl -LSs \"https://raw.githubusercontent.com/tiann/KernelSU/refs/heads/main/kernel/setup.sh\" | bash -s main\n  cd ./KernelSU\n\
          \  KSU_VERSION=$(expr $(curl -sI \"https://api.github.com/repos/tiann/KernelSU/commits?sha=main&per_page=1\" | grep -i \"link:\" | sed -n 's/.*page=\\([0-9]*\\)>; rel=\"last\".*/\\1/p') \"+\" 30000)\n\
          \  echo \"KSUVER=$KSU_VERSION\" >> $GITHUB_ENV\n  echo \"ksuver=$KSU_VERSION\" >> $GITHUB_OUTPUT\n  sed -i \"s/DKSU_VERSION=16/DKSU_VERSION=${KSU_VERSION}/\" kernel/Kbuild\nelse\n  echo \"已选择无内置KernelSU模式，跳过KernelSU配置...\"\
          \nfi\n"
      - name: 🛡️ 08 · 应用 KernelSU / SUSFS 补丁
        if: inputs.susfs_enable
        run: "cd kernel_workspace\nif [[ ${{ inputs.ksu_type }} != \"none\" ]]; then\n  echo \"正在添加susfs补丁...\"\n  git clone --depth=1 https://github.com/cctv18/susfs4oki.git susfs4ksu -b oki-${{\
          \ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}\n  wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/other_patch/69_hide_stuff.patch -O ./common/69_hide_stuff.patch\n\
          \  cp ./susfs4ksu/kernel_patches/50_add_susfs_in_gki-${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}.patch ./common/\n  cp ./susfs4ksu/kernel_patches/fs/* ./common/fs/\n  cp ./susfs4ksu/kernel_patches/include/linux/*\
          \ ./common/include/linux/\n  cd ./common\n  patch -p1 < 50_add_susfs_in_gki-${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}.patch || true\n  patch -p1 -N -F 3 < 69_hide_stuff.patch || true\n\
          \  cd ..\nelse\n  echo \"已选择无内置KernelSU模式，跳过susfs配置...\"\nfi\nif [[ ${{ inputs.ksu_type }} == \"ksu\" ]]; then\n  echo \"正在为原版 KernelSU (tiann/KernelSU)添加补丁...\"\n  cp ./susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch\
          \ ./KernelSU/\n  cd ./KernelSU\n  patch -p1 < 10_enable_susfs_for_ksu.patch || true\nfi\n"
      - name: 🩹 09 · 应用 LZ4 / ZSTD 补丁
        if: inputs.lz4_enable
        shell: bash
        run: |
          set -euo pipefail

          echo "正在添加 LZ4 1.10.0 & ZSTD 1.5.7 补丁…"
          cd kernel_workspace

          # 拉取当前仓库中的 zram_patch。
          # 使用固定目录名，避免 $GITHUB_ACTOR 与仓库目录/参数混淆。
          PATCH_REPO="kernel_builder_repo"

          rm -rf "$PATCH_REPO"
          git clone --depth=1 \
            --branch "$GITHUB_REF_NAME" \
            "https://github.com/$GITHUB_REPOSITORY.git" \
            "$PATCH_REPO"

          # 检查补丁文件是否存在。
          for patch_file in \
            001-lz4.patch \
            lz4armv8.S \
            002-zstd.patch
          do
            if [[ ! -f "$PATCH_REPO/zram_patch/$patch_file" ]]; then
              echo "❌ 缺少补丁文件：zram_patch/$patch_file"
              exit 1
            fi
          done

          cp "$PATCH_REPO/zram_patch/001-lz4.patch" ./common/
          cp "$PATCH_REPO/zram_patch/lz4armv8.S" ./common/lib/
          cp "$PATCH_REPO/zram_patch/002-zstd.patch" ./common/

          # 6.6.50 与 6.6.89 MTK 使用额外的 Makefile 清理补丁。
          if [[ "$TARGET" == "6.6.50" || "$TARGET" == "6.6.89 MTK" ]]; then
            if [[ ! -f "$PATCH_REPO/zram_patch/001-lz4-clearMake.patch" ]]; then
              echo "❌ 当前目标需要 001-lz4-clearMake.patch，但仓库中未找到"
              exit 1
            fi
            cp "$PATCH_REPO/zram_patch/001-lz4-clearMake.patch" ./common/
          fi

          cd ./common

          echo "▶ 应用 001-lz4.patch"
          git apply -p1 < 001-lz4.patch || true

          if [[ "$TARGET" == "6.6.50" || "$TARGET" == "6.6.89 MTK" ]]; then
            echo "▶ 应用 MTK 专用 001-lz4-clearMake.patch"
            git apply -p1 < 001-lz4-clearMake.patch || true
          fi

          echo "▶ 应用 002-zstd.patch"
          patch -p1 < 002-zstd.patch || true

          echo "✓ LZ4 / ZSTD 补丁处理完成"

      - name: 🩹 10 · 应用 LZ4KD 补丁
        if: inputs.lz4kd_enable
        run: "echo \"正在添加lz4kd补丁…\"\ncd kernel_workspace\nif [ ! -d \"SukiSU_patch\" ]; then\n  git clone --depth=1 https://github.com/ShirkNeko/SukiSU_patch.git\nfi\ncd common\ncp -r ../SukiSU_patch/other/zram/lz4k/include/linux/*\
          \ ./include/linux/\ncp -r ../SukiSU_patch/other/zram/lz4k/lib/* ./lib\ncp -r ../SukiSU_patch/other/zram/lz4k/crypto/* ./crypto\ncp ../SukiSU_patch/other/zram/zram_patch/${{ env.KERNEL_VERSION }}/lz4kd.patch\
          \ ./\npatch -p1 -F 3 < lz4kd.patch || true\n"
      - name: 🛡️ 11 · 配置 SUSFS
        if: inputs.susfs_enable
        run: 'cd kernel_workspace

          echo "CONFIG_KSU_SUSFS=y" >> ./common/arch/arm64/configs/gki_defconfig

          echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y" >> ./common/arch/arm64/configs/gki_defconfig

          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> ./common/arch/arm64/configs/gki_defconfig

          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> ./common/arch/arm64/configs/gki_defconfig

          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y" >> ./common/arch/arm64/configs/gki_defconfig

          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y" >> ./common/arch/arm64/configs/gki_defconfig

          echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> ./common/arch/arm64/configs/gki_defconfig

          echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" >> ./common/arch/arm64/configs/gki_defconfig

          echo "CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y" >> ./common/arch/arm64/configs/gki_defconfig

          echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> ./common/arch/arm64/configs/gki_defconfig

          echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> ./common/arch/arm64/configs/gki_defconfig

          echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> ./common/arch/arm64/configs/gki_defconfig

          echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" >> ./common/arch/arm64/configs/gki_defconfig

          echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> ./common/arch/arm64/configs/gki_defconfig

          echo "CONFIG_KSU_SUSFS_SUS_MAP=y" >> ./common/arch/arm64/configs/gki_defconfig

          '
      - name: ⚙️ 12 · 配置 KernelSU / 内核选项
        run: "cd kernel_workspace\necho \"CONFIG_KSU=y\" >> ./common/arch/arm64/configs/gki_defconfig\nif [[ \"${{ inputs.susfs_enable }}\" == \"false\" ]]; then\n  echo \"CONFIG_KSU_SUSFS=n\"\
          \ >> ./common/arch/arm64/configs/gki_defconfig\nfi\n#添加对 Mountify (backslashxx/mountify) 模块的支持\necho \"CONFIG_TMPFS_XATTR=y\" >> ./common/arch/arm64/configs/gki_defconfig\necho \"CONFIG_TMPFS_POSIX_ACL=y\"\
          \ >> ./common/arch/arm64/configs/gki_defconfig\nif [[ \"${{ inputs.lz4kd_enable }}\" == \"true\" ]]; then\n  echo \"CONFIG_ZSMALLOC=y\" >> ./common/arch/arm64/configs/gki_defconfig\n\
          \  echo \"CONFIG_CRYPTO_LZ4HC=y\" >> ./common/arch/arm64/configs/gki_defconfig\n  echo \"CONFIG_CRYPTO_LZ4K=y\" >> ./common/arch/arm64/configs/gki_defconfig\n  echo \"CONFIG_CRYPTO_LZ4KD=y\" >>\
          \ ./common/arch/arm64/configs/gki_defconfig\n  echo \"CONFIG_CRYPTO_842=y\" >> ./common/arch/arm64/configs/gki_defconfig\nfi\n# 开启O2编译优化配置\necho \"CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y\" >> ./common/arch/arm64/configs/gki_defconfig\n\
          #禁用 defconfig 检查\nsed -i 's/check_defconfig//' ./common/build.config.gki\n#跳过将uapi标准头安装到 usr/include 目录的不必要操作，节省编译时间\necho \"CONFIG_HEADERS_INSTALL=n\" >> ./common/arch/arm64/configs/gki_defconfig\n\
          # 应用 CVE_2026_43499 修复补丁\ncd common\nwget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/other_patch/cve-2026-43499-rtmutex-6.6.patch\npatch -p1 -F 3 < cve-2026-43499-rtmutex-6.6.patch\n"
      - name: 🌐 13 · 启用网络增强
        if: inputs.better_net
        run: 'cd kernel_workspace

          #启用  BPF 流解析器,实现高性能网络流量处理,增强网络监控和分析能力

          echo "CONFIG_BPF_STREAM_PARSER=y" >> ./common/arch/arm64/configs/gki_defconfig

          #开启增强 Netfilter 防火墙扩展模块,支持基于地址类型的匹配规则,启用 IP 集合支持,提高防火墙规则灵活性,支持更复杂的流量过滤策略

          echo "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y" >> ./common/arch/arm64/configs/gki_defconfig

          echo "CONFIG_NETFILTER_XT_SET=y" >> ./common/arch/arm64/configs/gki_defconfig

          #启用 IP 集框架及其多种数据结构实现,提供高效的大规模 IP 地址管理,提高防火墙规则处理效率,减少内存占用

          echo "CONFIG_IP_SET=y" >> ./common/arch/arm64/configs/gki_defconfig

          echo "CONFIG_IP_SET_MAX=65534" >> ./common/arch/arm64/configs/gki_defconfig

          echo "CONFIG_IP_SET_BITMAP_IP=y" >> ./common/arch/arm64/configs/gki_defconfig

          echo "CONFIG_IP_SET_BITMAP_IPMAC=y" >> ./common/arch/arm64/configs/gki_defconfig

          echo "CONFIG_IP_SET_BITMAP_PORT=y" >> ./common/arch/arm64/configs/gki_defconfig

          echo "CONFIG_IP_SET_HASH_IP=y" >> ./common/arch/arm64/configs/gki_defconfig

          echo "CONFIG_IP_SET_HASH_IPMARK=y" >> ./common/arch/arm64/configs/gki_defconfig

          echo "CONFIG_IP_SET_HASH_IPPORT=y" >> ./common/arch/arm64/configs/gki_defconfig

          echo "CONFIG_IP_SET_HASH_IPPORTIP=y" >> ./common/arch/arm64/configs/gki_defconfig

          echo "CONFIG_IP_SET_HASH_IPPORTNET=y" >> ./common/arch/arm64/configs/gki_defconfig

          echo "CONFIG_IP_SET_HASH_IPMAC=y" >> ./common/arch/arm64/configs/gki_defconfig

          echo "CONFIG_IP_SET_HASH_MAC=y" >> ./common/arch/arm64/configs/gki_defconfig

          echo "CONFIG_IP_SET_HASH_NETPORTNET=y" >> ./common/arch/arm64/configs/gki_defconfig

          echo "CONFIG_IP_SET_HASH_NET=y" >> ./common/arch/arm64/configs/gki_defconfig

          echo "CONFIG_IP_SET_HASH_NETNET=y" >> ./common/arch/arm64/configs/gki_defconfig

          echo "CONFIG_IP_SET_HASH_NETPORT=y" >> ./common/arch/arm64/configs/gki_defconfig

          echo "CONFIG_IP_SET_HASH_NETIFACE=y" >> ./common/arch/arm64/configs/gki_defconfig

          echo "CONFIG_IP_SET_LIST_SET=y" >> ./common/arch/arm64/configs/gki_defconfig

          #启用 IPv6 网络地址转换

          echo "CONFIG_IP6_NF_NAT=y" >> ./common/arch/arm64/configs/gki_defconfig

          echo "CONFIG_IP6_NF_TARGET_MASQUERADE=y" >> ./common/arch/arm64/configs/gki_defconfig

          #由于部分机型的vintf兼容性检测规则，在开启CONFIG_IP6_NF_NAT后开机会出现"您的设备内部出现了问题。请联系您的设备制造商了解详情。"的提示，故添加一个配置修复补丁，在编译内核时隐藏CONFIG_IP6_NF_NAT=y但不影响对应功能编译

          cd common

          wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/other_patch/config.patch

          patch -p1 -F 3 < config.patch || true

          '
      - name: 🌐 14 · 配置 BBR 等拥塞控制
        run: "if [[ \"${{ inputs.bbr_enable }}\" != \"false\" ]]; then\n  echo \"正在添加BBR等拥塞控制算法...\"\n  cd kernel_workspace\n  #开启TCP拥塞控制算法控制器（必需）\n  echo \"CONFIG_TCP_CONG_ADVANCED=y\" >> ./common/arch/arm64/configs/gki_defconfig\n\
          \  ################################################################################################################################\n  # BBR：基于链路容量的代表拥塞控制算法，不再使用丢包、延时等信号去衡量拥塞是否发生，而是直接对网络建模来应对、避免真实的网络拥塞；\n\
          \  # 具有高吞吐、低延迟、抗丢包的特点，但在手机上使用时由于持续探测带宽/RTT、高频计算与发包增加 CPU 和射频模块功耗，会增加耗电及发热；\n  # 且移动基站缓冲区深度通常较小（~50ms），BBR 的带宽探测阶段（ProbeRTT）过度降窗可能导致吞吐量骤降，且网络切换（WiFi→5G）时需重新\n  # 探测参数，反而增加延迟或导致速率振荡（短暂卡顿），且存在 RTT\
          \ 不公平性，与基于丢包的流竞争时可能过于强势，在混合网络环境中\n  #（如 BBR + CUBIC 共存），BBR 会抢占更多其他软件的带宽，降低其他应用的公平性（如后台软件更新影响前台视频播放）。\n  # 因此，虽然BBR可以显著减少排队延迟，抗丢包能力强，带宽利用率高，但由于其会增加耗电，且易导致网络速率波动，故安卓系统默认不使用\n  # BBR拥塞算法，而是使用在吞吐量、稳定性、兼容性、能效之间取得最佳平衡的CUBIC算法。在开启BBR前，请考虑自己是否真的有使用BBR的必要。\n\
          \  ################################################################################################################################\n  echo \"CONFIG_TCP_CONG_BBR=y\" >> ./common/arch/arm64/configs/gki_defconfig\n\
          \  #CUBIC：安卓的默认TCP拥塞控制算法，在吞吐量、稳定性、兼容性、能效之间取得最佳平衡，具有高兼容性与公平性、抗网络波动性强、低计算开销的特点，是绝大部分移动场景的优先选择\n  echo \"CONFIG_TCP_CONG_CUBIC=y\" >> ./common/arch/arm64/configs/gki_defconfig\n  #VEGAS：基于时延的拥塞控制算法之一，将回路响应时间（Round\
          \ Trip Time，RTT）增加视为出现拥塞，增加时增大拥塞窗口，减小时减小拥塞窗口\n  echo \"CONFIG_TCP_CONG_VEGAS=y\" >> ./common/arch/arm64/configs/gki_defconfig\n  #New Vegas：Vegas 算法的改进版，优化了 RTT 测量和竞争公平性，可以更准确地检测拥塞，与 Reno/CUBIC\
          \ 共存能力提升\n  echo \"CONFIG_TCP_CONG_NV=y\" >> ./common/arch/arm64/configs/gki_defconfig\n  #Westwood+：基于带宽估计（ACK 到达率）动态设置拥塞窗口和慢启动阈值；快速恢复，适合无线网络（区分拥塞丢包与无线丢包）\n  echo \"CONFIG_TCP_CONG_WESTWOOD=y\"\
          \ >> ./common/arch/arm64/configs/gki_defconfig\n  #HTCP：一种基于损失的算法，使用 AIMD 来控制拥塞窗口，根据 RTT 动态调整增长因子，结合延迟和丢包信号，针对高延迟的高速网络进行优化\n  echo \"CONFIG_TCP_CONG_HTCP=y\" >> ./common/arch/arm64/configs/gki_defconfig\n\
          \  #brutal：一种通过主动探测 + 激进抢占最大化吞吐量的拥塞算法，无拥塞窗口上限，轻度丢包（<20%）不降窗，避免类似 BBR 的 ProbeRTT 阶段，\n  #持续维持高发送速率，与 Reno/CUBIC 共存时，Brutal 可通过高频发包抢占 90%+ 带宽，适用于高丢包弱网环境（如公共 Wi-Fi、蜂窝网络）及\n  #直播推流、云游戏上行链路等需优先保证吞吐量而非延迟敏感的场景，提升弱网吞吐性能，对抗运营商\
          \ QoS 限速。但由于TCP Brutal 仅在应用程序\n  #对每个 TCP 连接设置带宽参数之后才能正常工作，绝大部分安卓应用都不支持该操作，故请勿将 TCP Brutal 设置成默认拥塞控制算法。\n  echo \"CONFIG_TCP_CONG_BRUTAL=y\" >> ./common/arch/arm64/configs/gki_defconfig\n  if [[\
          \ \"${{ inputs.bbr_enable }}\" == \"default\" ]]; then\n    echo \"正在将BBR设为默认拥塞控制算法...\"\n    echo \"CONFIG_DEFAULT_TCP_CONG=bbr\" >> ./common/arch/arm64/configs/gki_defconfig\n  else\n\
          \    echo \"CONFIG_DEFAULT_TCP_CONG=cubic\" >> ./common/arch/arm64/configs/gki_defconfig\n  fi\nfi\n"
      - name: 📦 15 · 启用 DroidSpaces
        run: "if [[ \"${{ inputs.droidspaces_enable }}\" != \"false\" ]]; then\n  echo \"正在启用 Droidspaces 容器支持...\"\n  cd kernel_workspace/common\n  # 应用 Droidspaces 容器必须补丁\n  wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/droidspaces_patch/fix_sysvipc_kabi_6_7_8.patch\n\
          \  patch -p1 -F 3 < fix_sysvipc_kabi_6_7_8.patch || true\n  # 修补 oplus_bsp_midas 行为，避免开机崩溃\n  wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/droidspaces_patch/fix_oplus_bsp_midas.patch\n\
          \  patch -p1 -F 3 < fix_oplus_bsp_midas.patch || true\n  # 应用 NTSync 补丁\n  wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/droidspaces_patch/ntsync_base.patch\n  wget\
          \ https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/droidspaces_patch/ntsync_compat_${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}.patch\n  patch -p1 -F 3 < ntsync_base.patch\
          \ || true\n  patch -p1 -F 3 < ntsync_compat_${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}.patch || true\n  # 开启 Droidspaces 容器所需内核支持\n  echo \"CONFIG_PID_NS=y\" >> ./arch/arm64/configs/gki_defconfig\n\
          \  echo \"CONFIG_IPC_NS=y\" >> ./arch/arm64/configs/gki_defconfig\n  echo \"CONFIG_USER_NS=y\" >> ./arch/arm64/configs/gki_defconfig\n  echo \"CONFIG_SYSVIPC=y\" >> ./arch/arm64/configs/gki_defconfig\n\
          \  echo \"CONFIG_DEVTMPFS=y\" >> ./arch/arm64/configs/gki_defconfig\n  echo \"CONFIG_NAMESPACES=y\" >> ./arch/arm64/configs/gki_defconfig\n  echo \"CONFIG_POSIX_MQUEUE=y\" >> ./arch/arm64/configs/gki_defconfig\n\
          \  echo \"CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y\" >> ./arch/arm64/configs/gki_defconfig\n  echo \"CONFIG_NETFILTER_XT_TARGET_LOG=y\" >> ./arch/arm64/configs/gki_defconfig\n  echo \"CONFIG_NETFILTER_XT_MATCH_RECENT=y\"\
          \ >> ./arch/arm64/configs/gki_defconfig\n  # 未经测试的配置选项，可能导致bug\n  #echo \"CONFIG_CGROUP_DEVICE=y\" >> ./arch/arm64/configs/gki_defconfig\n  #echo \"CONFIG_CGROUP_PIDS=y\" >> ./arch/arm64/configs/gki_defconfig\n\
          \  #echo \"CONFIG_FW_LOADER_COMPRESS=y\" >> ./arch/arm64/configs/gki_defconfig\n  #echo \"CONFIG_BRIDGE_NETFILTER=y\" >> ./arch/arm64/configs/gki_defconfig\n  #echo \"CONFIG_NF_TABLES=y\" >> ./arch/arm64/configs/gki_defconfig\n\
          \  # 开启 NTSync\n  echo \"CONFIG_NTSYNC=y\" >> ./arch/arm64/configs/gki_defconfig\n  if [[ \"${{ inputs.droidspaces_enable }}\" == \"extend\" ]]; then\n    echo \"正在启用容器环境扩展支持...\"\n\
          \    # 开启虚拟 HCI 设备支持\n    echo \"CONFIG_BT_HCIVHCI=y\" >> ./arch/arm64/configs/gki_defconfig\n    # 开启 systemd-coredump 支持\n    echo \"CONFIG_STATIC_USERMODEHELPER=n\" >> ./arch/arm64/configs/gki_defconfig\n\
          \    # 添加 Lindroid EVDI DRM 驱动\n    wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/droidspaces_patch/evdi_drm.patch\n    patch -p1 -F 3 < evdi_drm.patch || true\n   \
          \ echo \"CONFIG_DRM_LINDROID_EVDI=y\" >> ./arch/arm64/configs/gki_defconfig\n  fi\nfi\n"
      - name: ⚡ 16 · 启用 ADIOS IO 调度器
        if: inputs.adios_enable
        run: 'echo "正在启用ADIOS IO调度器(将截止时间优先调度算法与基于自主学习的自适应延迟控制算法相结合, 降低I/O延迟)…"

          cd kernel_workspace

          echo "CONFIG_MQ_IOSCHED_ADIOS=y" >> ./common/arch/arm64/configs/gki_defconfig

          echo "CONFIG_MQ_IOSCHED_DEFAULT_ADIOS=y" >> ./common/arch/arm64/configs/gki_defconfig

          '
      - name: ⚡ 17 · 启用 Re-Kernel
        if: inputs.rekernel_enable
        run: 'echo "正在启用Re-Kernel支持(用于与Freezer,NoActive等软件配合使用,提升冻结后台能力)…"

          cd kernel_workspace

          echo "CONFIG_REKERNEL=y" >> ./common/arch/arm64/configs/gki_defconfig

          '
      - name: 🛡️ 18 · 启用内核级基带保护
        if: inputs.baseband_guard
        run: 'echo "正在启用启用内核级基带保护支持…"

          cd kernel_workspace

          echo "CONFIG_BBG=y" >> ./common/arch/arm64/configs/gki_defconfig

          cd ./common

          curl -sSL https://github.com/cctv18/Baseband-guard/raw/master/setup.sh | bash

          sed -i ''/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }'' security/Kconfig

          '
      - name: 🏷️ 19 · 设置内核版本标识
        run: "cd kernel_workspace\necho \"替换内核版本后缀...\"\nif [[ -n \"${{ inputs.kernel_suffix }}\" ]]; then\n  echo \"当前内核版本后缀：${{ inputs.kernel_suffix }}\"\n  for f in ./common/scripts/setlocalversion;\
          \ do\n    sed -i \"\\$s|echo \\\"\\\\\\$res\\\"|echo \\\"-${{ inputs.kernel_suffix }}\\\"|\" \"$f\"\n  done\n  sudo sed -i 's/-4k/-${{ inputs.KERNEL_SUFFIX }}/g' ./common/arch/arm64/configs/gki_defconfig\n\
          else\n  echo \"当前内核版本后缀：${{ env.KERNEL_NAME }}\"\n  for f in ./common/scripts/setlocalversion; do\n    sed -i \"\\$s|echo \\\"\\\\\\$res\\\"|echo \\\"-${{ env.KERNEL_NAME }}\\\"|\" \"$f\"\n  done\n\
          \  sudo sed -i 's/-4k/-${{ env.KERNEL_NAME }}/g' ./common/arch/arm64/configs/gki_defconfig\nfi\nsed -i 's/${scm_version}//' ./common/scripts/setlocalversion\necho \"CONFIG_LOCALVERSION_AUTO=n\"\
          \ >> ./common/arch/arm64/configs/gki_defconfig\n \n"
      - name: 🔨 20 · 编译内核
        run: 'WORKDIR="$(pwd)"

          export PATH="/usr/lib/ccache:$PATH"

          export PATH="$WORKDIR/kernel_workspace/clang18/bin:$PATH"

          export PATH="$WORKDIR/kernel_workspace/build-tools/bin:$PATH"

          CLANG_DIR="$WORKDIR/kernel_workspace/clang18/bin"

          CLANG_VERSION="$($CLANG_DIR/clang --version | head -n 1)"

          LLD_VERSION="$($CLANG_DIR/ld.lld --version | head -n 1)"

          echo "编译器信息:"

          echo "Clang版本: $CLANG_VERSION"

          echo "LLD版本: $LLD_VERSION"

          pahole_version=$(pahole --version 2>/dev/null | head -n1); [ -z "$pahole_version" ] && echo "pahole版本：未安装" || echo "pahole版本：$pahole_version"


          export CCACHE_LOGFILE="${{ github.workspace }}/kernel_workspace/ccache.log"

          export CCACHE_COMPILERCHECK="none"

          export CCACHE_BASEDIR="${{ github.workspace }}"

          export CCACHE_NOHASHDIR="true"

          export CCACHE_NOHARDLINK="true"

          export CCACHE_DIR="${{ env.CCACHE_DIR }}"

          export CCACHE_MAXSIZE="3G"

          export CCACHE_IS_KERNEL_COMPILING="true"

          echo "sloppiness = file_stat_matches,include_file_ctime,include_file_mtime,pch_defines,file_macro,time_macros" >> "$CCACHE_DIR/ccache.conf"


          cd kernel_workspace/common

          wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/lib/libfakestat.so

          wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/lib/libfaketimeMT.so

          chmod 777 ./*.so

          export FAKESTAT="2025-05-25 12:00:00"

          export FAKETIME="@2025-05-25 13:00:00"

          echo "FAKESTAT=$FAKESTAT" >> $GITHUB_ENV

          echo "FAKETIME=$FAKETIME" >> $GITHUB_ENV

          SO_DIR=$(pwd)

          export PRELOAD_LIBS="$SO_DIR/libfakestat.so $SO_DIR/libfaketimeMT.so"

          #创建 CC (编译器) 包装器

          echo ''#!/bin/bash'' > cc-wrapper

          echo ''export LD_PRELOAD="''$PRELOAD_LIBS''"'' >> cc-wrapper

          echo ''export FAKESTAT="''$FAKESTAT''"'' >> cc-wrapper

          echo ''export FAKETIME="''$FAKETIME''"'' >> cc-wrapper

          echo ''ccache clang "$@"'' >> cc-wrapper

          #创建 LD (链接器) 包装器

          echo ''#!/bin/bash'' > ld-wrapper

          echo ''export LD_PRELOAD="''$PRELOAD_LIBS''"'' >> ld-wrapper

          echo ''export FAKESTAT="''$FAKESTAT''"'' >> ld-wrapper

          echo ''export FAKETIME="''$FAKETIME''"'' >> ld-wrapper

          echo ''ld.lld "$@"'' >> ld-wrapper


          # 测试时间劫持测试是否正常工作

          echo "--- [Wrapper Test] 正在创建通用的时间劫持测试脚本 ---"

          echo ''#!/bin/bash'' > test-wrapper.sh

          echo ''export LD_PRELOAD="''$PRELOAD_LIBS''"'' >> test-wrapper.sh

          echo ''export FAKESTAT="''$FAKESTAT''"'' >> test-wrapper.sh

          echo ''export FAKETIME="''$FAKETIME''"'' >> test-wrapper.sh

          echo ''echo ">>> Wrapper 内部环境检查完毕."'' >> test-wrapper.sh

          echo ''exec "$@"'' >> test-wrapper.sh # 执行所有传入的参数

          chmod +x test-wrapper.sh

          echo "--- [Wrapper Test] 正在测试 (date) 命令 ---"

          ./test-wrapper.sh date

          echo "--- [Wrapper Test] 正在测试 (stat) 命令 ---"

          ./test-wrapper.sh stat ./Makefile

          echo "--- [Wrapper Test] 测试完毕 ---"

          chmod +x cc-wrapper ld-wrapper

          echo "--- 编译前环境时间: $(LD_PRELOAD=$PRELOAD_LIBS date) ---"

          echo "--- 编译前环境文件时间戳: ---"

          LD_PRELOAD=$PRELOAD_LIBS stat ./Makefile


          #在构建内核的同时清除不必要的.NET, Android NDK, Haskell, CodeQL运行库，清理空间且不阻塞后续步骤运行

          sudo rm -rf /usr/share/dotnet &

          sudo rm -rf /usr/local/lib/android &

          sudo rm -rf /opt/ghc &

          sudo rm -rf /opt/hostedtoolcache/CodeQL &

          make -j$(nproc --all) LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC="ccache clang" LD="ld.lld" HOSTLD=ld.lld O=out KCFLAGS+=-O2 KCFLAGS+=-Wno-error gki_defconfig &&

          make -j$(nproc --all) LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC="$(pwd)/cc-wrapper" LD="$(pwd)/ld-wrapper" HOSTLD=ld.lld O=out KCFLAGS+=-O2 KCFLAGS+=-Wno-error Image


          # 编译后时间劫持二次校验

          echo "--- 编译后环境时间: $(LD_PRELOAD=$PRELOAD_LIBS date) ---"

          echo "--- 编译后环境文件时间戳: ---"

          LD_PRELOAD=$PRELOAD_LIBS stat ./Makefile

          echo "内核编译完成！"

          echo "ccache状态："

          ccache -s

          echo "编译后空间:"

          df -h

          '
      - name: 💾 21 · 保存 ccache
        if: inputs.ccache_update || steps.ccache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ env.CCACHE_REAL_KEY }}-${{ runner.os }}-${{ github.ref_name }}
      - name: 🩹 22 · 应用 KPM / 修补内核
        if: inputs.kpm_enable
        run: 'echo "正在应用KP-N并修补内核..."

          cd kernel_workspace/common/out/arch/arm64/boot

          wget https://github.com/KernelSU-Next/KPatch-Next/releases/latest/download/kptools-linux

          wget https://github.com/KernelSU-Next/KPatch-Next/releases/latest/download/kpimg-linux

          chmod +x ./kptools-linux

          ./kptools-linux -p -i ./Image -k ./kpimg-linux -o ./oImage

          rm -f Image

          mv oImage Image

          '
      - name: 📦 23 · 构建 AnyKernel3 刷机包
        id: create_zip
        run: "cd kernel_workspace\ngit clone https://github.com/HeiKe-Tom/AnyKernel3 --depth=1\nrm -rf ./AnyKernel3/.git\ncd AnyKernel3\ncp ../common/out/arch/arm64/boot/Image ./Image\nif [[ ! -f ./Image ]];\
          \ then\n  echo \"未找到内核镜像文件，构建可能出错\"\n  exit 1\nfi\nif [[ ${{ inputs.ksu_type }} == \"sukisu\" ]]; then\n  KSU_TYPENAME=\"SukiSU\"\nelif [[ ${{ inputs.ksu_type }} == \"\
          resukisu\" ]]; then\n  KSU_TYPENAME=\"ReSukiSU\"\nelif [[ ${{ inputs.ksu_type }} == \"ksunext\" ]]; then\n  KSU_TYPENAME=\"KSUNext\"\nelif [[ ${{ inputs.ksu_type }} ==\
          \ \"ksu\" ]]; then\n  KSU_TYPENAME=\"KSU\"\nelse\n  KSU_TYPENAME=\"none\"\nfi\nif [[ \"${{ inputs.lz4kd_enable }}\" == \"true\" ]]; then\n  wget https://raw.githubusercontent.com/$GITHUB_REPOSITORY/refs/heads/$GITHUB_REF_NAME/zram.zip\n\
          fi\nif [[ ${{ inputs.kpm_enable }} == 'true' ]]; then\n  wget https://github.com/cctv18/KPatch-Next/releases/latest/download/kpn.zip\nfi\nif [[ -n \"${{ inputs.kernel_suffix\
          \ }}\" ]]; then\n  AK3_NAME=AnyKernel3_${KSU_TYPENAME}_${{ env.KSUVER }}_${{ env.KERNEL_VERSION }}_${{ inputs.kernel_suffix }}.zip\nelse\n  AK3_NAME=AnyKernel3_${KSU_TYPENAME}_${{ env.KSUVER\
          \ }}_${{ env.KERNEL_VERSION }}_${{ env.KERNEL_NAME }}.zip\nfi\nzip -r ../$AK3_NAME ./*\necho \"ak3name=$AK3_NAME\" >> $GITHUB_OUTPUT\n\n#为AK3添加注释（调试信息）\nif [[ -n \"${{ inputs.kernel_suffix\
          \ }}\" ]]; then\n  FULL_VERSION=${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }}-${{ inputs.kernel_suffix }}\nelse\n  FULL_VERSION=${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }}-${{\
          \ env.KERNEL_NAME }}\nfi\nTIME_NOW=\"$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')\"\necho \"Author: $GITHUB_ACTOR\" > ./ak3.log\necho \"Repo: $GITHUB_REPOSITORY\" >> ./ak3.log\necho \"Branch:\
          \ $GITHUB_REF_NAME\" >> ./ak3.log\necho \"Run ID: $GITHUB_RUN_ID\" >> ./ak3.log\necho \"Commit: $GITHUB_SHA\" >> ./ak3.log\necho \"Time: $TIME_NOW\" >> ./ak3.log\necho \"Kernel Ver: $FULL_VERSION\"\
          \ >> ./ak3.log\necho \"KSU Branch: ${KSU_TYPENAME}\" >> ./ak3.log\necho \"KSU Ver: ${KSUVER}\" >> ./ak3.log\necho \"susfs: ${{ inputs.susfs_enable }}\" >> ./ak3.log\necho \"KPM: ${{\
          \ github.event.inputs.kpm_enable }}\" >> ./ak3.log\necho \"LZ4: ${{ inputs.lz4_enable }}\" >> ./ak3.log\necho \"LZ4KD: ${{ inputs.lz4kd_enable }}\" >> ./ak3.log\necho \"\
          IPset: ${{ inputs.better_net }}\" >> ./ak3.log\necho \"BBR&Brutal: ${{ inputs.bbr_enable }}\" >> ./ak3.log\necho \"Droidspaces: ${{ inputs.droidspaces_enable\
          \ }}\" >> ./ak3.log\necho \"ADIOS: ${{ inputs.adios_enable }}\" >> ./ak3.log\necho \"Re-Kernel: ${{ inputs.rekernel_enable }}\" >> ./ak3.log\necho \"BBG: ${{ inputs.baseband_guard\
          \ }}\" >> ./ak3.log\nzip -z ../$AK3_NAME < ./ak3.log\n"
      - name: 🔍 25 · 验证刷机包并生成构建报告
        if: always()
        shell: bash
        run: "set -u\necho \"\"\necho \"━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\"\necho \"\U0001F50D 25 · 构建产物验证与报告\"\necho \"━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\"\
          \n\nZIP_FILE=\"$(find \"$GITHUB_WORKSPACE\" -maxdepth 2 -type f -name 'AnyKernel3_*.zip' -print -quit 2>/dev/null || true)\"\n\nif [[ -n \"$ZIP_FILE\" ]]; then\n  SIZE=\"$(du -h \"$ZIP_FILE\" |\
          \ awk '{print $1}')\"\n  SHA256=\"$(sha256sum \"$ZIP_FILE\" | awk '{print $1}')\"\n  echo \"✓ 刷机包：$(basename \"$ZIP_FILE\")\"\n  echo \"✓ 文件大小：$SIZE\"\n  echo \"✓ SHA256：$SHA256\"\n\n  {\n    echo\
          \ \"## \U0001F4E6 构建产物\"\n    echo \"\"\n    echo \"| 项目 | 信息 |\"\n    echo \"| --- | --- |\"\n    echo \"| 内核 | ${KERNEL_VERSION}.${SUB_VERSION} |\"\n    echo \"| Android | ${ANDROID_VERSION} |\"\
          \n    echo \"| 架构 | arm64 |\"\n    echo \"| KSU | ${{ inputs.ksu_type || '未指定' }} |\"\n    echo \"| SUSFS | ${{ inputs.susfs_enable || '未指定' }} |\"\n    echo \"| KPM |\
          \ ${{ inputs.kpm_enable || '未指定' }} |\"\n    echo \"| LZ4 | ${{ inputs.lz4_enable || '未指定' }} |\"\n    echo \"| BBR | ${{ inputs.bbr_enable || '未指定' }} |\"\
          \n    echo \"| ADIOS | ${{ inputs.adios_enable || '未指定' }} |\"\n    echo \"| 基带保护 | ${{ inputs.baseband_guard || '未指定' }} |\"\n    echo \"| 刷机包 | `$(basename \"$ZIP_FILE\"\
          )` |\"\n    echo \"| 大小 | $SIZE |\"\n    echo \"| SHA256 | `$SHA256` |\"\n    echo \"\"\n    echo \"### \U0001F9EA Runner 状态\"\n    echo '```text'\n    df -h /\n    echo '```'\n  } >> \"$GITHUB_STEP_SUMMARY\"\
          \nelse\n  echo \"⚠ 未找到 AnyKernel3 刷机包\"\n  echo \"## ⚠️ 构建产物\"\n  echo \"未找到 `AnyKernel3_*.zip`，请检查编译与打包步骤。\" >> \"$GITHUB_STEP_SUMMARY\"\nfi"
      - name: 🔍 24 · 上传 ccache 调试日志
        if: always() && inputs.ccache_debug
        uses: actions/upload-artifact@v7
        with:
          name: ccache-debug-log
          path: ${{ github.workspace }}/kernel_workspace/ccache.log
          archive: true
      - name: 📤 25 · 上传 ZIP 工件
        uses: actions/upload-artifact@v7
        with:
          path: ${{ github.workspace }}/kernel_workspace/AnyKernel*.zip
          archive: false
      - name: 🩺 26 · 失败诊断
        if: failure()
        shell: bash
        run: "set +e\necho \"\"\necho \"━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\"\necho \"\U0001FA7A 99 · 失败诊断\"\necho \"━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\"\
          \necho \"▶ Runner：${RUNNER_OS}\"\necho \"▶ 工作目录：${GITHUB_WORKSPACE}\"\necho \"▶ 分支：${GITHUB_REF_NAME}\"\necho \"▶ 提交：${GITHUB_SHA}\"\necho \"\"\necho \"▶ 磁盘空间：\"\ndf -h\necho \"\"\necho \"▶ 内存：\"\
          \nfree -h 2>/dev/null || true\n{\n  echo \"## ❌ 构建失败诊断\"\n  echo \"\"\n  echo \"- Runner：`${RUNNER_OS}`\"\n  echo \"- 分支：`${GITHUB_REF_NAME}`\"\n  echo \"- 提交：`${GITHUB_SHA}`\"\n  echo \"- 时间：`$(date\
          \ '+%Y-%m-%d %H:%M:%S %Z')`\"\n} >> \"$GITHUB_STEP_SUMMARY\"\n"
    timeout-minutes: 360
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      actions: read
    steps:
    - name: 📋 00 · 发布任务概览
      shell: bash
      run: 'set -e

        echo ""

        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

        echo "🚀 发布阶段 · GitHub Release"

        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

        echo "▶ 仓库：${GITHUB_REPOSITORY}"

        echo "▶ 分支：${GITHUB_REF_NAME}"

        echo "▶ 运行：#${GITHUB_RUN_NUMBER}"

        echo "✓ 发布环境初始化完成"

        echo ""

        '
    - name: 📥 01 · 下载 ZIP 工件
      uses: actions/download-artifact@v8
      with:
        name: ${{ needs.build.outputs.ak3name }}
        path: ./release_zips
        skip-decompress: true
        # ============================================================
    # 🏷️ 02 · 生成发布信息
    # ============================================================
    - name: 🏷️ 02 · 生成发布信息
      shell: bash
      run: |
        set -euo pipefail

        # ========================================================
        # 从 build Job 获取输出
        # ========================================================
        SUB_VERSION="${{ needs.build.outputs.sub_version }}"
        TARGET="${{ needs.build.outputs.target }}"
        TARGET_DEVICE="${{ needs.build.outputs.target_device }}"

        # ========================================================
        # 基础数据检查
        # ========================================================
        if [[ -z "$SUB_VERSION" ]]; then
          echo "❌ 无法获取内核子版本号"
          echo "❌ needs.build.outputs.sub_version 为空"
          exit 1
        fi

        if [[ -z "$TARGET" ]]; then
          echo "⚠️ 编译目标为空"
          TARGET="未知"
        fi

        if [[ -z "$TARGET_DEVICE" ]]; then
          echo "⚠️ 目标设备为空"
          TARGET_DEVICE="未知"
        fi

        # ========================================================
        # 生成完整内核版本
        # ========================================================
        if [[ -n "${{ inputs.kernel_suffix }}" ]]; then
          FULL_VERSION="${KERNEL_VERSION}.${SUB_VERSION}-${{ inputs.kernel_suffix }}"
        else
          FULL_VERSION="${KERNEL_VERSION}.${SUB_VERSION}"
        fi

        # ========================================================
        # 时间信息
        # ========================================================
        TIME="$(TZ='Asia/Shanghai' date +'%y%m%d%H%M%S')"
        TIME_FORM="$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')"

        # ========================================================
        # Release 基础信息
        # ========================================================
        TAG_HEAD="OPPO-OPlus-Realme-build"

        # ========================================================
        # KSU 类型
        # ========================================================
        case "${{ inputs.ksu_type }}" in
          sukisu)
            KSU_TYPENAME="SukiSU Ultra"
            ;;
          resukisu)
            KSU_TYPENAME="ReSukiSU"
            ;;
          ksunext)
            KSU_TYPENAME="KernelSU Next"
            ;;
          ksu)
            KSU_TYPENAME="KSU"
            ;;
          *)
            KSU_TYPENAME="无内置KSU"
            ;;
        esac

        # ========================================================
        # 写入当前 Release Job 环境
        # ========================================================
        {
          echo "SUB_VERSION=$SUB_VERSION"
          echo "FULL_VERSION=$FULL_VERSION"
          echo "TIME=$TIME"
          echo "TIME_FORM=$TIME_FORM"
          echo "TAG_HEAD=$TAG_HEAD"
          echo "KSU_TYPENAME=$KSU_TYPENAME"
          echo "TARGET=$TARGET"
          echo "TARGET_DEVICE=$TARGET_DEVICE"
        } >> "$GITHUB_ENV"

        # ========================================================
        # 控制台显示
        # ========================================================
        echo ""
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "🏷️ 发布版本信息"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "📦 内核版本   : $FULL_VERSION"
        echo "🎯 编译目标   : $TARGET"
        echo "📱 目标设备   : $TARGET_DEVICE"
        echo "🔐 KSU        : $KSU_TYPENAME"
        echo "🕐 编译时间   : $TIME_FORM"
        echo "🏷️ Release    : ${TAG_HEAD}-${FULL_VERSION}"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo ""


    # ============================================================
    # 🚀 03 · 创建 GitHub Release
    # ============================================================
    - name: 🚀 03 · 创建 GitHub Release
      id: create_release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      shell: bash
      run: |
        set -euo pipefail

        # ========================================================
        # 生成 Release Notes
        # ========================================================
        cat > release_notes.md << EOF
        ### 📱 欧加真 ${KSU_TYPENAME} SM8750 通用内核 | 构建信息

        - **内核版本号**: ${FULL_VERSION}
        - **编译时间**: ${TIME_FORM}
        - **编译目标**: ${TARGET}
        - **目标设备**: OPPO-OPlus-Realme-SM8750 Devices
        - **KSU分支**: ${KSU_TYPENAME}

        ### 🧩 内核功能

        - SUSFS支持：${{ inputs.susfs_enable }}
        - KPM支持：${{ inputs.kpm_enable }}
        - LZ4支持：${{ inputs.lz4_enable }}
        - LZ4KD支持：${{ inputs.lz4kd_enable }}
        - 网络功能增强：${{ inputs.better_net }}
        - BBR/Brutal 等拥塞控制算法支持：${{ inputs.bbr_enable }}
        - DroidSpaces 容器支持：${{ inputs.droidspaces_enable }}
        - ADIOS IO调度器支持：${{ inputs.adios_enable }}
        - Re-Kernel支持：${{ inputs.rekernel_enable }}
        - 内核级基带保护支持：${{ inputs.baseband_guard }}

        ### 🔐 KSU 管理器

        - ReSukiSU管理器下载：[ReSukiSU_CI](https://github.com/cctv18/ReSukiSU_CI/releases)
        - SukiSU Ultra管理器下载：[SukiSU-Ultra](https://github.com/SukiSU-Ultra/SukiSU-Ultra/releases)
        - KernelSU Next管理器下载：[KernelSU-Next](https://github.com/KernelSU-Next/KernelSU-Next/releases)
        - KSU原版管理器下载：[KernelSU](https://github.com/tiann/KernelSU/releases)

        ### ⏫ 更新内容

        - 更新 ${KSU_TYPENAME} 至最新版本
        - KSU版本：${{ needs.build.outputs.ksuver }}

        ### 📋 安装方法 | Installation Guide

        1. 若手机已经安装第三方 Recovery，可下载对应机型的 AnyKernel 刷机包，通过 Recovery 刷入后重启设备。
        2. 若手机已经拥有 Root 权限，可使用 HorizonKernelFlasher 刷入 AnyKernel 刷机包。
        3. 若已经使用 SukiSU Ultra，可通过管理器直接刷入 AnyKernel 刷机包。
        4. 刷入无 LZ4KD 补丁版内核前，如果之前使用过 LZ4KD 补丁版内核，请先关闭 ZRAM 模块。
        5. 使用新版 KernelSU 系列管理器时，请根据实际情况安装对应的 Meta Module。
        6. KernelPatch Next（KPN）为独立的 KPM 实现，请勿与内置 KPM 同时使用。

        ### ⚠️ 重要提示

        **刷写内核存在变砖风险。**

        在刷入内核前，请务必使用[KernelFlasher](https://github.com/capntrips/KernelFlasher)等工具备份：
        - boot
        - vendor_boot
        - init_boot
        - dtbo
        - vbmeta

        请确认设备 SoC、内核版本以及目标机型与当前刷包匹配后再进行刷写。

